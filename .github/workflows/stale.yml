name: Stale Triage

on:
  schedule:
    # Daily weekday pass during US morning hours.
    - cron: '17 15 * * 1-5'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale-triage
  cancel-in-progress: false

jobs:
  stale:
    runs-on: kalana-ci
    timeout-minutes: 15
    steps:
      - name: Set up GitHub CLI without root privileges
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) cli_arch=amd64 ;;
            aarch64|arm64) cli_arch=arm64 ;;
            *) echo "::error::Unsupported GitHub CLI architecture"; exit 1 ;;
          esac
          cli_version=2.103.0
          cli_package="gh_${cli_version}_linux_${cli_arch}.tar.gz"
          cli_dir="$(mktemp -d "$RUNNER_TEMP/gh-cli.XXXXXX")"
          cli_url="https://github.com/cli/cli/releases/download/v${cli_version}"
          curl -fsSL --retry 3 "$cli_url/$cli_package" -o "$cli_dir/$cli_package"
          curl -fsSL --retry 3 "$cli_url/gh_${cli_version}_checksums.txt" -o "$cli_dir/checksums.txt"
          (cd "$cli_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$cli_dir/$cli_package" -C "$cli_dir"
          echo "$cli_dir/gh_${cli_version}_linux_${cli_arch}/bin" >> "$GITHUB_PATH"
      - name: Ensure stale label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "status: stale" \
            --repo "${{ github.repository }}" \
            --color "ededed" \
            --description "No recent activity; may be closed if it stays inactive" \
            --force

      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 200
          remove-stale-when-updated: true
          exempt-all-milestones: true
          exempt-issue-labels: pinned,security,good first issue,help wanted,needs reproduction
          exempt-pr-labels: pinned,security,dependencies,release,do not merge

          stale-issue-label: "status: stale"
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: >
            This issue has had no recent activity and is being marked stale.
            Please comment with new context if it is still relevant.
          close-issue-message: >
            Closing this issue due to continued inactivity. It can be reopened
            if there is new information or a clear next step.

          stale-pr-label: "status: stale"
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has had no recent activity and is being marked
            stale. Please rebase, resolve conflicts, or comment if it is still
            actively being worked.
          close-pr-message: >
            Closing this pull request due to continued inactivity. It can be
            reopened when it is ready for review again.
